<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quake-Checker Pro - 気象庁API連携版</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #map { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

    /* 操作パネルのスタイル */
    .control-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      width: 320px;
    }
    .control-panel h3 { margin-bottom: 15px; font-size: 16px; color: #333; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 12px; font-weight: bold; color: #555; margin-bottom: 5px; }
    .form-group input[type="range"] { width: 100%; }
    .val-display { color: #0284c7; font-weight: bold; font-size: 14px; }
    
    .btn-submit {
      width: 100%;
      padding: 10px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #0369a1; }
  </style>
</head>
<body>

  <!-- UI操作パネル -->
  <div class="control-panel">
    <h3>📡 気象庁API 地震データ取得</h3>
    
    <div class="form-group">
      <label>最小マグニチュード: <span class="val-display" id="mag-val">2.0</span></label>
      <input type="range" id="min-mag" min="0" max="7" step="0.5" value="2.0" oninput="document.getElementById('mag-val').textContent=this.value">
    </div>

    <div class="form-group">
      <label>最大震源深さ (km): <span class="val-display" id="depth-val">300</span></label>
      <input type="range" id="max-depth" min="10" max="700" step="10" value="300" oninput="document.getElementById('depth-val').textContent=this.value">
    </div>

    <button class="btn-submit" onclick="executeSearch()">データ取得・描画 🚀</button>
  </div>

  <!-- 地図を表示するコンテナ -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- システムのJavaScript -->
  <script>
    let map;
    let earthquakeLayerGroup = null;

    // ==========================================
    // 1. マップと地質図レイヤーの初期化
    // ==========================================
    function initMap() {
      // 描画を高速化するCanvasレンダラーを使用（熊本中心）
      map = L.map('map', { 
        zoomControl: false, 
        renderer: L.canvas() 
      }).setView([32.789, 130.705], 8);

      L.control.zoom({ position: 'bottomright' }).addTo(map);

      // 【重要】地質図専用のPaneを作り、乗算（multiply）で下の文字を透けさせる
      map.createPane('geologyPane');
      map.getPane('geologyPane').style.zIndex = 400;
      map.getPane('geologyPane').style.pointerEvents = 'none';
      map.getPane('geologyPane').style.mixBlendMode = 'multiply';

      // 背景：国土地理院 標準地図
      const stdMap = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
        maxZoom: 18, crossOrigin: true,
        attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'
      }).addTo(map);

      // 背景：国土地理院 陰影起伏図
      const hillShadeMap = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/hillshademap/{z}/{x}/{y}.png', {
        maxZoom: 16, crossOrigin: true,
        attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'
      });

      // 上書き：産総研 シームレス地質図V2
      const geologyTileLayer = L.tileLayer('https://gbank.gsj.jp/seamless/v2/api/1.2.1/tiles/{z}/{y}/{x}.png', {
        pane: 'geologyPane', minZoom: 5, maxNativeZoom: 13, maxZoom: 18, opacity: 0.75, crossOrigin: true,
        attribution: '<a href="https://gbank.gsj.jp/seamless/" target="_blank">産総研地質調査総合センター</a>'
      }).addTo(map);

      // レイヤー切り替えコントロール
      L.control.layers(
        { "地理院 標準地図": stdMap, "地理院 陰影起伏図": hillShadeMap },
        { "産総研 シームレス地質図V2": geologyTileLayer },
        { position: 'topright' }
      ).addTo(map);
    }

    // ==========================================
    // 2. 気象庁APIからのデータ取得・解析
    // ==========================================
    function parseJMACoordinate(cod) {
      if (!cod) return null;
      const match = cod.match(/^([+-]\d+(?:\.\d+)?)([+-]\d+(?:\.\d+)?)(?:([+-]\d+(?:\.\d+)?))?\//);
      if (!match) return null;
      return {
        lat: parseFloat(match[1]),
        lon: parseFloat(match[2]),
        depth: match[3] ? Math.abs(parseFloat(match[3])) / 1000 : 0
      };
    }

    async function executeSearch() {
      // スライダーの値を取得
      const minMag = parseFloat(document.getElementById('min-mag').value);
      const maxDepth = parseFloat(document.getElementById('max-depth').value);
      
      const btn = document.querySelector('.btn-submit');
      btn.textContent = "取得中...";
      btn.style.background = "#94a3b8";

      try {
        const response = await fetch('https://www.jma.go.jp/bosai/quake/data/list.json');
        if (!response.ok) throw new Error("気象庁API通信エラー");
        const data = await response.json();

        const features = [];
        data.forEach(eq => {
          if (!eq.cod) return;
          const coords = parseJMACoordinate(eq.cod);
          if (!coords) return;
          const mag = parseFloat(eq.mag) || 0;

          // フィルタリング条件
          if (mag >= minMag && coords.depth <= maxDepth) {
            features.push({
              "type": "Feature",
              "geometry": { "type": "Point", "coordinates": [coords.lon, coords.lat, coords.depth] },
              "properties": {
                "title": eq.anm || "震源地不明",
                "magnitude": mag,
                "depth": coords.depth,
                "maxInt": eq.maxi || "不明",
                "time": eq.at || eq.en_dt
              }
            });
          }
        });

        plotGeoJSON({ "type": "FeatureCollection", "features": features });
        
        btn.textContent = `完了 (${features.length}件表示)`;
        btn.style.background = "#16a34a";
        setTimeout(() => { btn.textContent = "データ取得・描画 🚀"; btn.style.background = "#0284c7"; }, 3000);

      } catch (error) {
        console.error(error);
        alert("気象庁APIからのデータ取得に失敗しました。");
        btn.textContent = "データ取得・描画 🚀";
        btn.style.background = "#0284c7";
      }
    }

    // ==========================================
    // 3. マップへのプロット（GeoJSON描画）
    // ==========================================
    function plotGeoJSON(geoJsonData) {
      if (earthquakeLayerGroup) map.removeLayer(earthquakeLayerGroup);

      earthquakeLayerGroup = L.geoJSON(geoJsonData, {
        pointToLayer: function (feature, latlng) {
          const mag = feature.properties.magnitude;
          const radius = Math.max(mag * 2.5, 4); 
          
          let fillColor = "#ffcc00"; // 小規模 (黄)
          if (mag >= 5.0) fillColor = "#cc0000"; // 大規模 (赤)
          else if (mag >= 3.0) fillColor = "#ff6600"; // 中規模 (オレンジ)

          return L.circleMarker(latlng, {
            radius: radius, fillColor: fillColor, color: "#000", weight: 1, opacity: 1, fillOpacity: 0.8
          });
        },
        onEachFeature: function (feature, layer) {
          const props = feature.properties;
          const maxInt = props.maxInt ? `震度 ${props.maxInt}` : "不明";
          
          layer.bindPopup(`
            <div style="font-family: sans-serif; min-width: 180px;">
              <h4 style="margin:0 0 5px 0; color:#333;">${props.title}</h4>
              <hr style="border:0; border-top:1px solid #ccc; margin:5px 0;">
              <b>最大震度:</b> <span style="color:red; font-weight:bold;">${maxInt}</span><br>
              <b>規模 (M):</b> ${props.magnitude}<br>
              <b>深さ:</b> ${props.depth} km<br>
              <b>発生日時:</b> ${new Date(props.time).toLocaleString('ja-JP')}
            </div>
          `);
        }
      });

      earthquakeLayerGroup.addTo(map);
    }

    // 画面ロード時にマップを初期化
    window.onload = initMap;
  </script>
</body>
</html>
